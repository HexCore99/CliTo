name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Rust backend
        working-directory: src-tauri
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose
